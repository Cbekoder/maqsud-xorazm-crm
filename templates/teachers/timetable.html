{% extends 'common/base.html' %}

{% load static %}

{% block extra_css %}

    <link href="{% static 'plugins/fullcalendar/css/main.min.css' %}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.lineicons.com/3.0/lineicons.css">
<!--<link href="{% static 'css/students/timetable.css' %}" rel="stylesheet">-->

{% endblock %}

{% block breadcrumb_icon %}
    <i class="lni lni-calendar" style="font-size: 150%;"></i>
{% endblock %}

{% block breadcrumb_title %} Jadval {% endblock %}

{% block subcontent %}

    <div class="card">
        <div class="card-body">
            <div class="table-responsive">
                <div id='calendar'></div>
            </div>
        </div>
     </div>

{% endblock %}


{% block extra_js %}

<script src="{% static 'plugins/fullcalendar/js/main.min.js' %}"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/locales/uz.global.min.js"></script>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    var calendarEl = document.getElementById('calendar');
    var events = {{ events|safe }};

    // Uzbek month and weekday names
    var uzMonths = [
      'Yanvar','Fevral','Mart','Aprel','May','Iyun',
      'Iyul','Avgust','Sentyabr','Oktyabr','Noyabr','Dekabr'
    ];
    var uzWeekdaysShort = ['Yak','Du','Se','Chor','Pay','Ju','Sha'];

    // Custom Uzbek locale for FullCalendar
    var uzLocale = {
      code: 'uz-custom',
      buttonText: {
        today: 'Bugun',
        month: 'Oylik',
        week:  'Haftalik',
        day:   'Kunlik',
        list:  'Roʻyxat',
        prev:  '‹',
        next:  '›'
      },
      weekText: 'Hafta',
      allDayText: 'Kun bo‘yi',
      moreLinkText: function(n) { return 'Yana ' + n + ' ta'; },
      noEventsText: 'Ko‘rsatiladigan tadbirlar yo‘q'
    };

    // Set Uzbek title (called after render & on each navigation)
    function setUzTitle(cal) {
      var d = cal.getDate(); // date inside the current view
      var titleEl = calendarEl.querySelector('.fc-toolbar-title');
      if (titleEl) titleEl.textContent = uzMonths[d.getMonth()] + ' ' + d.getFullYear();
    }

    var calendar = new FullCalendar.Calendar(calendarEl, {
      headerToolbar: {
        left: 'prev,next today',
        center: 'title',
        right: 'dayGridMonth' // keep only month view to avoid English day titles
      },
      initialView: 'dayGridMonth',
      initialDate: new Date(),
      navLinks: true,
      selectable: true,
      nowIndicator: true,
      dayMaxEvents: false,
      editable: false,
      businessHours: true,
      events: events,

      // Use our custom locale
      locale: uzLocale,

      // 24-hour times like 12:00
      eventTimeFormat: { hour: '2-digit', minute: '2-digit', hour12: false },

      // Uzbek weekday headers
      dayHeaderContent: function(arg) {
        return uzWeekdaysShort[arg.date.getDay()];
      },

      // Make sure the toolbar title is always Uzbek
      datesSet: function() { setUzTitle(calendar); }
    });

    calendar.render();
    setUzTitle(calendar); // set once immediately
  });
</script>

{% endblock %}
